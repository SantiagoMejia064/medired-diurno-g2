
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E6ECEA">
  <title>Médicos | MediRed IPS</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/medicos.js"></script>
</head>

<body class="panel" data-privado hidden>
  <aside class="lateral">
    <div class="marca">
      <img src="css/pulso.svg" alt="" width="42" height="42">
      <span>MediRed <small>IPS</small></span>
    </div>

    <nav aria-label="Navegación principal">
      <a href="inicio.html">Inicio</a>
      <a href="citas.html">Citas</a>
      <a href="historias.html">Historias</a>
      <a href="medicos.html" aria-current="page">Médicos</a>
    </nav>

    <div class="sesion">
      <span data-rol></span>
      <button type="button" data-salir>Cerrar sesión</button>
    </div>
  </aside>

  <main class="contenido">
    <header class="encabezado">
      <div>
        <p class="etiqueta">Personal de salud</p>
        <h1>Médicos</h1>
        <p id="modo-consulta" class="secundario" hidden>
          Modo de solo consulta
        </p>
      </div>

      <button id="nuevo-medico" class="boton primario"
              type="button" hidden>
        Nuevo médico
      </button>
    </header>

    <p id="aviso" class="aviso" role="status"></p>

    <section class="tarjeta listado"
             aria-labelledby="titulo-listado">
      <h2 id="titulo-listado">Médicos registrados</h2>

      <p id="estado-listado" role="status">
        Cargando médicos…
      </p>

      <div class="tabla-contenedor"
           role="region"
           aria-labelledby="titulo-listado"
           tabindex="0"
           hidden>
        <table aria-labelledby="titulo-listado">
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Registro médico</th>
              <th scope="col">Especialidad</th>
              <th scope="col">Sede</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="filas-medicos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Formulario para crear y editar médicos -->
  <dialog id="editor" aria-labelledby="titulo-editor">
    <form id="formulario-medico">
      <h2 id="titulo-editor"></h2>

      <div class="campos">
        <div>
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre"
                 type="text" required>
        </div>

        <div>
          <label for="registro_medico">Registro médico</label>
          <input id="registro_medico"
                 name="registro_medico"
                 type="text" required>
        </div>

        <div>
          <label for="especialidad">Especialidad</label>
          <input id="especialidad"
                 name="especialidad"
                 type="text" required>
        </div>

        <div>
          <label for="sede">Sede</label>
          <select id="sede" name="sede" required>
            <option value="">Selecciona una sede</option>
            <option value="Cali">Cali</option>
            <option value="Bogotá">Bogotá</option>
            <option value="Medellín">Medellín</option>
          </select>
        </div>
      </div>

      <p id="error-editor" class="error" role="alert"></p>

      <div class="acciones-dialogo">
        <button id="cancelar-editor"
                class="boton"
                type="button">
          Cancelar
        </button>
        <button class="boton primario" type="submit">
          Guardar médico
        </button>
      </div>
    </form>
  </dialog>

  <!-- Ventana de detalles -->
  <dialog id="detalle" aria-labelledby="titulo-detalle">
    <h2 id="titulo-detalle">Detalle del médico</h2>
    <dl id="datos-detalle"></dl>

    <form method="dialog" class="acciones-dialogo">
      <button class="boton primario" type="submit">
        Cerrar
      </button>
    </form>
  </dialog>
</body>
</html>
