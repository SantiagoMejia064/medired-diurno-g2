
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E6ECEA">

  <title>Pacientes | MediRed IPS</title>

  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/pacientes.js"></script>
</head>

<body class="panel" data-privado hidden>

  <!-- =====================================================
       MENÚ LATERAL
  ====================================================== -->

  <aside class="lateral">

    <div class="marca">
      <img src="css/pulso.svg" alt="" width="42" height="42">
      <span>MediRed <small>IPS</small></span>
    </div>

    <nav aria-label="Navegación principal">
      <a href="inicio.html">Inicio</a>
      <a href="citas.html">Citas</a>
      <a href="historias.html">Historias</a>
      <a href="medicos.html">Médicos</a>
      <a href="pacientes.html" aria-current="page">Pacientes</a>
    </nav>

    <div class="sesion">
      <span data-rol></span>
      <button type="button" data-salir>Cerrar sesión</button>
    </div>

  </aside>

  <!-- =====================================================
       CONTENIDO PRINCIPAL
  ====================================================== -->

  <main class="contenido">

    <header class="encabezado">

      <div>
        <p class="etiqueta">Gestión de usuarios de salud</p>

        <h1>Pacientes</h1>

        <p id="modo-consulta" class="secundario" hidden>
          Modo de solo consulta
        </p>
      </div>

      <button
        id="nuevo-paciente"
        class="boton primario"
        type="button"
        hidden>
        Nuevo paciente
      </button>

    </header>

    <p id="aviso" class="aviso" role="status"></p>

    <!-- =================================================
         LISTADO DE PACIENTES
    ================================================== -->

    <section
      class="tarjeta listado"
      aria-labelledby="titulo-listado">

      <h2 id="titulo-listado">Pacientes registrados</h2>

      <p id="estado-listado" role="status">
        Cargando pacientes…
      </p>

      <div
        class="tabla-contenedor"
        role="region"
        aria-labelledby="titulo-listado"
        tabindex="0"
        hidden>

        <table aria-labelledby="titulo-listado">

          <thead>
            <tr>
              <th scope="col">Nombre completo</th>
              <th scope="col">Documento</th>
              <th scope="col">Fecha de nacimiento</th>
              <th scope="col">EPS</th>
              <th scope="col">Teléfono</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>

          <tbody id="filas-pacientes"></tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- =====================================================
       FORMULARIO CREAR / EDITAR PACIENTE
  ====================================================== -->

  <dialog id="editor" aria-labelledby="titulo-editor">

    <form id="formulario-paciente">

      <h2 id="titulo-editor">Nuevo paciente</h2>

      <div class="campos">

        <div>
          <label for="nombre">Nombre completo</label>

          <input
            id="nombre"
            name="nombre"
            type="text"
            maxlength="100"
            placeholder="Nombre del paciente"
            required>
        </div>

        <div>
          <label for="documento">Número de documento</label>

          <input
            id="documento"
            name="documento"
            type="text"
            inputmode="numeric"
            maxlength="10"
            pattern="[0-9]{6,10}"
            placeholder="Ej. 1001234567"
            required>
        </div>

        <div>
          <label for="fecha_nacimiento">Fecha de nacimiento</label>

          <input
            id="fecha_nacimiento"
            name="fecha_nacimiento"
            type="date"
            required>
        </div>

        <div>
          <label for="eps">EPS</label>

          <input
            id="eps"
            name="eps"
            type="text"
            maxlength="100"
            placeholder="Ej. Sura"
            required>
        </div>

        <div>
          <label for="telefono">Teléfono</label>

          <input
            id="telefono"
            name="telefono"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            pattern="[0-9]{10}"
            placeholder="Ej. 3001234567"
            required>
        </div>

      </div>

      <p id="error-editor" class="error" role="alert"></p>

      <div class="acciones-dialogo">

        <button
          id="cancelar-editor"
          class="boton"
          type="button">
          Cancelar
        </button>

        <button
          id="guardar-paciente"
          class="boton primario"
          type="submit">
          Registrar paciente
        </button>

      </div>

    </form>

  </dialog>

  <!-- =====================================================
       DETALLE DEL PACIENTE
  ====================================================== -->

  <dialog id="detalle" aria-labelledby="titulo-detalle">

    <h2 id="titulo-detalle">Detalle del paciente</h2>

    <dl id="datos-detalle"></dl>

    <form method="dialog" class="acciones-dialogo">

      <button class="boton primario" type="submit">
        Cerrar
      </button>

    </form>

  </dialog>

</body>
</html>
